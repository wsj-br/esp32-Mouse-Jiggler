; LilyGO T-Display-S3 Pro. Default env is the HID-only mouse.
; jiggler-debug adds a USB serial port so upload can auto-reset.
; The pio board id is the S3 module. Pro pins are in the sketch, not the variant.

[platformio]
default_envs = jiggler

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_protocol = esptool
upload_port = /dev/ttyACM0
; RTS hard-reset leaves this board in the ROM serial bootloader.
board_upload.after_reset = watchdog-reset
board_build.arduino.memory_type = qio_opi
; Board manifest forces Hardware CDC (USB mode 1). USBHIDMouse requires USB-OTG.
build_unflags =
    -DARDUINO_USB_MODE=1
; USB host MSC is compiled with the USB library and includes FS/FatFs.
; The library finder does not add those include paths on its own.
; SensorLib (CST touch) comes from the LilyGO tree. The panel is LovyanGFX SPI.
lib_extra_dirs = ../T-Display-S3/lib
lib_ignore =
    Adafruit MPR121
    arduino-nofrendo
    DabbleESP32
    ESP32-audioI2S-master
    ESP32_Host_MIDI
    GFX Library for Arduino
    Gingoduino
    lvgl
    OneButton
    PCA95x5
    PCF8575 library
    TFT_eSPI
    TouchLib
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
    -I${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
lib_deps =
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS
    lovyan03/LovyanGFX@^1.2.0

[env:jiggler]
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:jiggler-debug]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
